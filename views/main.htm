<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      name="application-name"
      content="Servicio web de rastreo de automoviles"
    />
    <meta name="author" content="Raul Ramos" />
    <meta name="copyright" content="Redfox S.A.S." />
    <meta
      name="description"
      content="Empresa de Rastreo Satelital, Seguimiento de Vehiculos con tecnologia GPS"
    />
    <meta
      name="keywords"
      content="Rastreo, Satelital, GPS, Tracking, Seguimiento Satelital"
    />
    <meta name="robots" content="index,follow" />
    <meta http-equiv="Content-Type" content="text/html" />

    <title>{Title}</title>

    <link rel="icon" sizes="192x192" href="{Icon}" />
     <!--Scripts-->
    {Scripts}   
    
    <!--Estilos-->
    {Styles}
  </head>

  <body>
    <!--cabecera princila-->
    <header class="header" x-data="{ open: false }">
      <div class="header-logo">
        <a href="/dashboard" title="Pagina principal">
          <img src="{Logo}" />
        </a>
      </div>
      {Menu}
      <div class='app-route'>{Route}</div>
      {User}
    </header>

    <!--panel lateral de menus adicionales y formulario de filtros-->
    <div class="panel-options">
		  {Panel}
	  </div>

    <!--cuerpo principal-->
    <div id="appbody" class="body" style="z-index: 0; margin: 0px">
      {Body}
    </div>

    <!--definicion del footer-->
    <footer>
    </footer>

    {Window}
  
    <!--escript de cierre de prorgama-->
    <script language="javascript">
      {Jsvars}
    </script>

  </body>
</html>
